<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>PicMap</title>
    <style>
        body {
            font-family: sans-serif;
            background: linear-gradient(135deg, #0a0a1a, #1a1a2e);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            text-align: center;
            padding: 60px;
            background: rgba(20, 20, 30, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
        }
        h1 {
            font-size: 48px;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .status { color: #22c55e; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>PicMap</h1>
        <p>Твои путешествия. Твои воспоминания.</p>
        <div class="status">● Deploy works!</div>
    </div>
</body>
</html>
